[package]
name = "vs-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
bytes = "1"
futures = "0.3"
mimalloc = "0.1"
postgres-replication = { workspace = true }
postgres-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { workspace = true }
